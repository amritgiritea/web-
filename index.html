  <style>
  :root {
    color-scheme: light;
    --bg: #F8F0E3;
    --surface: #FFFBF4;
    --band: #EEDCC2;
    --beige: #F2E4CE;
    --ink: #33241A;
    --muted: #65503F;
    --head: #5B3A21;
    --forest: #7A4B2A;
    --btn: #7B4A2A;
    --btn-fg: #FFFFFF;
    --btn-hover: #5E3519;
    --gold: #C28B3C;
    --gold-ink: #7A4F18;
    --line: rgba(194, 139, 60, 0.42);
    --hair: rgba(91, 58, 33, 0.16);
    --shadow: 0 14px 40px rgba(91, 58, 33, 0.16);
    --shadow-sm: 0 4px 14px rgba(91, 58, 33, 0.11);
    --foot: #6B4429;
    --foot-fg: #F8EBD6;
    --head-bg: rgba(248, 240, 227, 0.86);
    --glow: rgba(232, 188, 112, 0.55);
    --serif: "Cormorant Garamond", "Tiro Devanagari Hindi", Georgia, "Times New Roman", serif;
    --hi: "Tiro Devanagari Hindi", "Noto Serif Devanagari", "Cormorant Garamond", serif;
    --sans: "Hind", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.65;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow-x: hidden;
  }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--serif); color: var(--head); text-wrap: balance; margin: 0; font-weight: 600; line-height: 1.12; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hi { font-family: var(--hi); }

  .band { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1180px; margin: 0 auto; }
  section { padding-block: clamp(56px, 8vw, 104px); }
  .eyebrow { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-ink); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 1rem/1 var(--sans); padding: 15px 26px; border-radius: 999px; border: 1.5px solid transparent;
    background: var(--btn); color: var(--btn-fg); text-decoration: none; cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .btn:hover { transform: translateY(-2px); background: var(--btn-hover); box-shadow: var(--shadow-sm); }
  .btn:active { transform: translateY(0); }
  .btn-ghost { background: transparent; color: var(--head); border-color: var(--gold); }
  .btn-ghost:hover { background: var(--beige); }
  .btn-sm { padding: 11px 20px; font-size: 0.92rem; }

  .site-head {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    background: var(--head-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); transition: box-shadow .3s ease;
  }
  .head-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 20px; height: 82px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
  .brand-mark { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; background: #174C35; border: 1px solid var(--gold); flex: none; }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-family: var(--serif); font-weight: 700; font-size: 1.5rem; color: var(--head); line-height: 1; }
  .brand-name small { display: block; font-family: var(--hi); font-weight: 400; font-size: 0.82rem; color: var(--gold-ink); margin-top: 3px; }
  .nav { display: flex; gap: 6px; }
  .nav a { text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; font-size: 0.98rem; color: var(--ink); transition: background .2s, color .2s; }
  .nav a:hover { background: var(--band); color: var(--head); }
  .head-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--hair); background: var(--surface); color: var(--head); display: inline-grid; place-items: center; cursor: pointer; }
  .cart-count { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: #2B1B10; font-size: 0.74rem; font-weight: 700; display: grid; place-items: center; }

  .hero { padding-top: clamp(32px, 5vw, 64px); background: radial-gradient(900px 500px at 85% 20%, var(--band), transparent 70%), var(--bg); overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
  .pill { display: inline-flex; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--gold); background: var(--surface); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.16em; color: var(--gold-ink); }
  .hero h1 { font-family: var(--hi); font-weight: 400; font-size: clamp(2.2rem, 5.2vw, 4rem); line-height: 1.28; margin-top: 22px; }
  .hero .lead { margin-top: 20px; font-size: 1.12rem; color: var(--muted); max-width: 520px; }
  .hero .tag-hi { margin-top: 14px; font-family: var(--hi); font-size: 1.25rem; color: var(--forest); }
  .cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
  .trust { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 34px; padding: 0; list-style: none; }
  .trust li { display: flex; align-items: center; gap: 9px; font-size: 0.95rem; font-weight: 500; color: var(--head); }
  .trust svg { width: 20px; height: 20px; color: var(--gold); flex: none; }
  .stage { position: relative; aspect-ratio: 1 / 1.02; width: 100%; max-width: 560px; margin-inline: auto; }
  .sun { position: absolute; inset: 4% 6% 22% 6%; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 68%); }
  .arch { position: absolute; left: 8%; right: 8%; top: 6%; bottom: 8%; border-radius: 999px 999px 28px 28px; background: linear-gradient(180deg, var(--band), var(--beige)); border: 1px solid var(--line); }
  .pack { position: absolute; left: 50%; top: 4%; width: 56%; translate: -50% 0; }
  .pack img { border-radius: 14px; box-shadow: 0 28px 48px rgba(91, 58, 33, 0.38); border: 1px solid var(--gold); }
  .cup { position: absolute; left: 2%; bottom: 3%; width: 38%; border-radius: 50%; overflow: hidden; border: 4px solid var(--surface); box-shadow: var(--shadow); aspect-ratio: 1; }
  .cup img { width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr; }
    .stage { max-width: 440px; }
    .nav { display: none; }
  }
  </style>
</head>
